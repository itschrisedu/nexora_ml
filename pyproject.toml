[project]
name = "nexora-ml"
version = "1.0.0"
description = "Microservicio de Predicción de Demanda — Nexora ERP"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
dev = "uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
